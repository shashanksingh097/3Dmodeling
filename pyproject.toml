[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeler3d"
version = "0.3.0"
description = "Command-driven 3D modeler: every GUI action is a text command."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "cadquery-ocp>=7.7",
    "numpy>=1.24",
    "meshio>=5.3",  # mesh files: VTK, PLY, OBJ, OFF, Gmsh and other simulation formats
    "manifold3d>=3.0",  # mesh bodies: fast, always-closed booleans on triangles
    "scipy>=1.12",  # STRESS: the sparse solver and nearest-point search of the strength check
]

[project.optional-dependencies]
test = ["pytest>=7"]
# the assistant on GitHub Copilot (needs Python 3.11+); users sign in with their own GitHub account
ai = ["github-copilot-sdk>=1.0.33,<2; python_version >= '3.11'"]

[project.scripts]
modeler = "modeler.__main__:main"

[tool.setuptools.packages.find]
include = ["modeler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
