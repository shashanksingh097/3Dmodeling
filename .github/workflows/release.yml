name: Release builds

# Builds the desktop app for Windows, macOS and Linux with PyInstaller.
# - A pull request that touches packaging builds too (no release).
# - Run it by hand (Actions > Release builds > Run workflow) to get test
#   builds as downloadable artifacts.
# - Push a tag such as v0.1.0 and it also makes a DRAFT GitHub release with
#   the three downloads attached; publishing the draft is a manual step.
# - Or run it by hand with a `tag` (and optionally the commit to build as
#   `ref`): same draft release, and publishing it creates the tag on that
#   commit. Handy when tags cannot be pushed from where you work.
# See docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Make a draft release with this tag, e.g. v0.1.0 (empty: test builds only)"
        required: false
        default: ""
      ref:
        description: "Commit or branch to build (empty: the branch this runs on)"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:  # a PR that changes the packaging gets test builds too
    paths: ["packaging/**", ".github/workflows/release.yml", "pyproject.toml"]

permissions:
  contents: write

env:
  # the release tag: a pushed tag, or the tag asked for by hand
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag || '' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04  # older glibc, so the build runs on more Linux versions
            name: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Check the version matches the tag
        if: env.TAG != ''
        shell: bash
        run: |
          v=$(python -c "import modeler; print(modeler.__version__)")
          test "v$v" = "$TAG" || { echo "modeler.__version__ is $v but the tag is $TAG"; exit 1; }
      - name: Build
        run: pyinstaller packaging/3Dmodeling.spec --noconfirm
      - name: Smoke test (headless)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then dir=dist/3Dmodeling.app/Contents/MacOS; else dir=dist/3Dmodeling; fi
          "$dir/3Dmodeling-cli" --version
          "$dir/3Dmodeling-cli" check
          "$dir/3Dmodeling-cli" run scripts/flange.cmd -q
          "$dir/3Dmodeling-cli" run scripts/threaded_bolts.cmd -q
      - name: Pack
        shell: bash
        run: |
          v=$(python -c "import modeler; print(modeler.__version__)")
          out="3Dmodeling-$v-${{ matrix.name }}"
          mkdir -p release
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip "../release/$out.zip" 3Dmodeling >/dev/null) ;;
            macOS)   ditto -c -k --keepParent dist/3Dmodeling.app "release/$out.zip" ;;
            Linux)   tar -C dist -czf "release/$out.tar.gz" 3Dmodeling ;;
          esac
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: 3Dmodeling-${{ matrix.name }}
          path: release/*
          retention-days: 14

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Commit to release
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md || true
          test -s notes.md || echo "Release $TAG" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: 3Dmodeling ${{ env.TAG }}
          body_path: notes.md
          files: release/*
