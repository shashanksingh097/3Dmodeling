name: Release builds

# Builds the desktop app for Windows, macOS and Linux with PyInstaller.
# - A pull request that touches packaging builds too (no release).
# - Run it by hand (Actions > Release builds > Run workflow) to get test
#   builds as downloadable artifacts.
# - Each build is packed twice: a portable archive (.zip / .tar.gz) and, on
#   Windows and macOS, an installer (.msi made with WiX, .dmg). Both installers
#   are tried in the job: the .msi is installed and removed again, the .dmg
#   mounted, and the installed app's command line run.
# - Push a tag such as v0.1.0 and it also makes a DRAFT GitHub release with
#   the downloads attached; publishing the draft is a manual step.
# - Or run it by hand with a `tag` (and optionally the commit to build as
#   `ref`): same draft release, and publishing it creates the tag on that
#   commit. Handy when tags cannot be pushed from where you work.
# See docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Make a draft release with this tag, e.g. v0.1.0 (empty: test builds only)"
        required: false
        default: ""
      ref:
        description: "Commit or branch to build (empty: the branch this runs on)"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:  # a PR that changes the packaging gets test builds too
    paths: ["packaging/**", ".github/workflows/release.yml", "pyproject.toml"]

permissions:
  contents: write

env:
  # the release tag: a pushed tag, or the tag asked for by hand
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag || '' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:  # "yes" when the signing secrets are set (a step's own env is not seen by its `if`)
      WIN_SIGN: ${{ secrets.WINDOWS_CERT_PFX != '' && 'yes' || '' }}
      MAC_SIGN: ${{ secrets.MACOS_CERT_P12 != '' && 'yes' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04  # older glibc, so the build runs on more Linux versions
            name: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ai]" pyinstaller
      - name: Check the version matches the tag
        if: env.TAG != ''
        shell: bash
        run: |
          v=$(python -c "import modeler; print(modeler.__version__)")
          test "v$v" = "$TAG" || { echo "modeler.__version__ is $v but the tag is $TAG"; exit 1; }
      - name: Build
        run: pyinstaller packaging/3Dmodeling.spec --noconfirm
      # Code signing runs only when the signing secrets are set (see docs/RELEASING.md);
      # without them the builds are unsigned, as before.
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'yes'
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($exe in Get-ChildItem dist\3Dmodeling\*.exe) {
            & $signtool.FullName sign /f $pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d 3Dmodeling $exe.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Remove-Item $pfx
      - name: Sign (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGN == 'yes'
        env:
          MAC_CERT: ${{ secrets.MACOS_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MAC_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        shell: bash
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"; kp=$(uuidgen)
          echo "$MAC_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security list-keychain -d user -s "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          codesign --force --deep --options runtime --timestamp \
            --entitlements packaging/entitlements.plist --sign "$MAC_IDENTITY" dist/3Dmodeling.app
          codesign --verify --deep --strict --verbose=2 dist/3Dmodeling.app
      - name: Smoke test (headless)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then dir=dist/3Dmodeling.app/Contents/MacOS; else dir=dist/3Dmodeling; fi
          "$dir/3Dmodeling-cli" --version
          "$dir/3Dmodeling-cli" check
          "$dir/3Dmodeling-cli" run scripts/flange.cmd -q
          "$dir/3Dmodeling-cli" run scripts/threaded_bolts.cmd -q
          # the assistant is bundled: its Copilot runtime downloads and starts (nobody is signed in here)
          out=$("$dir/3Dmodeling-cli" copilot status 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "not signed in"
      # the built app in a real window (docs/site/desktop-check.md); hosted runners have no real
      # GPU, so this is best effort: the report is kept to read either way
      - name: Desktop check (best effort)
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then dir=dist/3Dmodeling.app/Contents/MacOS; else dir=dist/3Dmodeling; fi
          "$dir/3Dmodeling-cli" desktop-check --out "$RUNNER_TEMP/desktop-check"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Linux'
        continue-on-error: true
        with:
          name: desktop-check-${{ runner.os }}
          path: ${{ runner.temp }}/desktop-check
      - name: Pack
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MAC_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          v=$(python -c "import modeler; print(modeler.__version__)")
          out="3Dmodeling-$v-${{ matrix.name }}"
          mkdir -p release
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip "../release/$out.zip" 3Dmodeling >/dev/null) ;;
            macOS)
              ditto -c -k --keepParent dist/3Dmodeling.app "release/$out.zip"
              if [ -n "$APPLE_ID" ] && [ "$MAC_SIGN" = "yes" ]; then  # notarize, staple, pack again
                xcrun notarytool submit "release/$out.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                  --password "$APPLE_APP_PASSWORD" --wait
                xcrun stapler staple dist/3Dmodeling.app
                rm "release/$out.zip"
                ditto -c -k --keepParent dist/3Dmodeling.app "release/$out.zip"
              fi
              # the .dmg: the app beside a link to Applications, to drag it across
              mkdir -p dmg && cp -R dist/3Dmodeling.app dmg/ && ln -s /Applications dmg/Applications
              hdiutil create -volname 3Dmodeling -srcfolder dmg -ov -format UDZO "release/$out.dmg"
              if [ "$MAC_SIGN" = "yes" ]; then codesign --sign "$MAC_IDENTITY" --timestamp "release/$out.dmg"; fi
              rm -rf dmg ;;
            Linux)   tar -C dist -czf "release/$out.tar.gz" 3Dmodeling ;;
          esac
          ls -l release
      - name: Installer (Windows .msi)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          $v = python -c "import modeler; print(modeler.__version__)"
          $msi = "release\3Dmodeling-$v-${{ matrix.name }}.msi"
          # an absolute folder: WiX reads the Files glob relative to the .wxs, not to here
          $src = (Resolve-Path dist\3Dmodeling).Path
          & $wix build packaging\3Dmodeling.wxs -arch x64 -d "Version=$v" -d "SourceDir=$src" -o $msi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item release\*.wixpdb -ErrorAction SilentlyContinue
          if ($env:WIN_SIGN -eq "yes") {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f $pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d 3Dmodeling $msi
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Remove-Item $pfx
          }
          # try it: install, run the installed command line, remove
          $p = Start-Process msiexec -ArgumentList "/i `"$((Resolve-Path $msi).Path)`" /qn /l*v msi-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 60; exit 1 }
          & "C:\Program Files\3Dmodeling\3Dmodeling-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\3Dmodeling.lnk")) {
            Write-Host "no Start menu entry"; exit 1
          }
          $p = Start-Process msiexec -ArgumentList "/x `"$((Resolve-Path $msi).Path)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Test-Path "C:\Program Files\3Dmodeling\3Dmodeling-cli.exe") { Write-Host "not removed"; exit 1 }
          Get-ChildItem release
      - name: Try the .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls release/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          "$RUNNER_TEMP/dmg/3Dmodeling.app/Contents/MacOS/3Dmodeling-cli" --version
          test -L "$RUNNER_TEMP/dmg/Applications"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: 3Dmodeling-${{ matrix.name }}
          path: release/*
          retention-days: 14

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Commit to release
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md || true
          test -s notes.md || echo "Release $TAG" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: 3Dmodeling ${{ env.TAG }}
          body_path: notes.md
          files: release/*
