name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,ai]"
      - name: Environment check
        run: python -m modeler check

      - name: Headless tests (commands and model)
        env:
          MODELER_GUI_TESTS: "0"
        run: python -m pytest -q

      - name: Linux display libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0
      - name: GUI tests (3D view and picking, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python -m pytest -q tests/test_viewport.py tests/test_sketch_gui.py tests/test_forms_gui.py tests/test_app_shell.py tests/test_render.py tests/test_nurbs_gui.py tests/test_assistant_gui.py tests/test_skills_gui.py tests/test_desktop_check.py tests/test_drag_handles.py tests/test_plugins_gui.py tests/test_shortcuts_gui.py

      # Hosted Windows/macOS runners have no real GPU, so OpenGL may be
      # missing there. This still shows whether the native window handle
      # wraps correctly; the real check is running the app on a desktop.
      - name: GUI tests (best effort)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: python -m pytest -q tests/test_viewport.py tests/test_sketch_gui.py tests/test_forms_gui.py tests/test_app_shell.py tests/test_render.py tests/test_nurbs_gui.py tests/test_assistant_gui.py tests/test_skills_gui.py tests/test_desktop_check.py tests/test_drag_handles.py tests/test_plugins_gui.py tests/test_shortcuts_gui.py
      - name: Desktop check (best effort)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: python -m modeler desktop-check --out desktop-check
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Linux'
        continue-on-error: true
        with:
          name: desktop-check-${{ matrix.os }}
          path: desktop-check

  perf:
    name: speed benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      # times import, rebuild, picking, drawing and save/open with memory; fails when a
      # case is over its budget in docs/perf-budgets.json (docs/speed-sessions.md)
      - name: Benchmark
        run: python -m modeler perf --check --json perf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: perf.json
